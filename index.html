<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambient TV Fotolijst &amp; Kalender</title>
    <meta name="description" content="Digitale fotolijst voor je tv met Google Photos albums, Google Calendar widget en responsive admin omgeving." />
    <meta property="og:title" content="Ambient TV Fotolijst &amp; Kalender" />
    <meta property="og:description" content="Digitale fotolijst voor je tv met Google Photos albums, Google Calendar widget en responsive admin omgeving." />
    <meta property="og:type" content="website" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      html.tv-mode-active, body.tv-mode-active {
        height: 100%;
        overflow: hidden;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        position: relative;
        background-color: #000000;
      }
      /* Fallback TV presentation styles (runs before/without React) */
      .tv-fallback-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
      }
      .tv-fallback-bg {
        position: absolute;
        inset: -5%;
        width: 110%;
        height: 110%;
        background-size: cover;
        background-position: center;
        filter: blur(28px) brightness(0.4);
        opacity: 0.85;
        transition: opacity 1.5s ease-in-out;
      }
      .tv-fallback-main {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 2;
        transition: opacity 1.2s ease-in-out;
      }
      .tv-fallback-card {
        position: absolute;
        bottom: 2.5rem;
        left: 2.5rem;
        z-index: 10;
        color: #ffffff;
        pointer-events: none;
      }
      .tv-fallback-time {
        font-size: 5rem;
        font-weight: 300;
        letter-spacing: -0.04em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.95);
        font-family: monospace, -apple-system, sans-serif;
      }
      .tv-fallback-date {
        margin-top: 0.6rem;
        font-size: 1.2rem;
        font-weight: 500;
        color: #e2e8f0;
        text-transform: capitalize;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
      }
    </style>
    <script>
      // Ensure trailing slash for GitHub Pages repo path so relative assets resolve correctly
      if (window.location.pathname.endsWith('/fotolijst2')) {
        window.location.replace('/fotolijst2/' + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Instant Fallback for Smart TVs: starts rendering within milliseconds -->
      <div id="tv-fallback" class="tv-fallback-container">
        <div id="tv-fallback-bg" class="tv-fallback-bg"></div>
        <img id="tv-fallback-img" class="tv-fallback-main" alt="TV Fotolijst" />
        
        <div class="tv-fallback-card">
          <div id="tv-fallback-time" class="tv-fallback-time">--:--</div>
          <div id="tv-fallback-date" class="tv-fallback-date">Laden...</div>
        </div>
      </div>
      <script>
        (function() {
          var photos = [];
          
          try {
            // Check hash for immediate sync on first TV visit
            var hash = window.location.hash || window.location.search;
            if (hash && (hash.indexOf('config=') !== -1 || hash.indexOf('sync=') !== -1)) {
              var clean = hash.replace(/^[#?]/, '').replace(/^config=/, '').replace(/^sync=/, '');
              var jsonStr = decodeURIComponent(escape(atob(decodeURIComponent(clean))));
              var parsedSync = JSON.parse(jsonStr);
              if (parsedSync && parsedSync.photos && parsedSync.photos.length > 0) {
                photos = parsedSync.photos.map(function(p) { return p.url; });
                localStorage.setItem('ambient_tv_frame_cached_photos_v1', JSON.stringify(parsedSync.photos));
              }
            }
          } catch(e) {}

          if (photos.length === 0) {
            try {
              var cached = localStorage.getItem('ambient_tv_frame_cached_photos_v1');
              if (cached) {
                var parsedList = JSON.parse(cached);
                if (Array.isArray(parsedList) && parsedList.length > 0) {
                  photos = parsedList.map(function(p) { return p.url; });
                }
              }
            } catch(e) {}
          }

          if (photos.length === 0) {
            try {
              var stored = localStorage.getItem('ambient_tv_frame_settings_v1');
              if (stored) {
                var parsed = JSON.parse(stored);
                if (parsed && parsed.customPhotos && parsed.customPhotos.length > 0) {
                  photos = parsed.customPhotos.map(function(p) { return p.url; });
                }
              }
            } catch(e) {}
          }

          var currentIndex = 0;
          var imgEl = document.getElementById('tv-fallback-img');
          var bgEl = document.getElementById('tv-fallback-bg');
          var timeEl = document.getElementById('tv-fallback-time');
          var dateEl = document.getElementById('tv-fallback-date');

          function updateClock() {
            var now = new Date();
            var hours = ('0' + now.getHours()).slice(-2);
            var mins = ('0' + now.getMinutes()).slice(-2);
            if (timeEl) timeEl.textContent = hours + ':' + mins;

            var days = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
            var months = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
            if (dateEl) {
              dateEl.textContent = days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()];
            }
          }

          function showPhoto(idx) {
            if (photos.length === 0) {
              if (imgEl) imgEl.style.display = 'none';
              if (bgEl) bgEl.style.background = 'radial-gradient(circle at center, #0f172a 0%, #000000 100%)';
              return;
            }
            var url = photos[idx % photos.length];
            if (imgEl) {
              imgEl.style.display = 'block';
              imgEl.src = url;
            }
            if (bgEl) bgEl.style.backgroundImage = 'url(' + url + ')';
          }

          updateClock();
          showPhoto(0);
          setInterval(updateClock, 1000);

          if (photos.length > 1) {
            setInterval(function() {
              currentIndex = (currentIndex + 1) % photos.length;
              showPhoto(currentIndex);
            }, 10000);
          }
        })();
      </script>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
