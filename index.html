<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambient TV Fotolijst &amp; Kalender</title>
    <meta name="description" content="Digitale fotolijst voor je tv met Google Photos albums, Google Calendar widget en responsive admin omgeving." />
    <meta property="og:title" content="Ambient TV Fotolijst &amp; Kalender" />
    <meta property="og:description" content="Digitale fotolijst voor je tv met Google Photos albums, Google Calendar widget en responsive admin omgeving." />
    <meta property="og:type" content="website" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #root {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        position: relative;
        background-color: #000000;
      }
      /* Fallback TV presentation styles (runs before/without React) */
      .tv-fallback-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
      }
      .tv-fallback-bg {
        position: absolute;
        inset: -5%;
        width: 110%;
        height: 110%;
        background-size: cover;
        background-position: center;
        filter: blur(28px) brightness(0.4);
        opacity: 0.85;
        transition: opacity 1.5s ease-in-out;
      }
      .tv-fallback-main {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 2;
        transition: opacity 1.2s ease-in-out;
      }
      .tv-fallback-card {
        position: absolute;
        bottom: 2.5rem;
        left: 2.5rem;
        z-index: 10;
        color: #ffffff;
        pointer-events: none;
      }
      .tv-fallback-time {
        font-size: 5rem;
        font-weight: 300;
        letter-spacing: -0.04em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.95);
        font-family: monospace, -apple-system, sans-serif;
      }
      .tv-fallback-date {
        margin-top: 0.6rem;
        font-size: 1.2rem;
        font-weight: 500;
        color: #e2e8f0;
        text-transform: capitalize;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
      }
    </style>
    <script>
      // Ensure trailing slash for GitHub Pages repo path so relative assets resolve correctly
      if (window.location.pathname.endsWith('/fotolijst2')) {
        window.location.replace('/fotolijst2/' + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Instant Fallback for Smart TVs: starts rendering within milliseconds -->
      <div id="tv-fallback" class="tv-fallback-container">
        <div id="tv-fallback-bg" class="tv-fallback-bg"></div>
        <img id="tv-fallback-img" class="tv-fallback-main" alt="TV Fotolijst" />
        
        <div class="tv-fallback-card">
          <div id="tv-fallback-time" class="tv-fallback-time">--:--</div>
          <div id="tv-fallback-date" class="tv-fallback-date">Laden...</div>
        </div>
      </div>
      <script>
        (function() {
          var photos = [
            'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2560&q=85',
            'https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?auto=format&fit=crop&w=2560&q=85',
            'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2560&q=85',
            'https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=2560&q=85',
            'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=2560&q=85'
          ];
          
          try {
            var stored = localStorage.getItem('ambient_tv_settings');
            if (stored) {
              var parsed = JSON.parse(stored);
              if (parsed && parsed.customPhotos && parsed.customPhotos.length > 0) {
                var customUrls = parsed.customPhotos.map(function(p) { return p.url; });
                if (customUrls.length > 0) photos = customUrls;
              }
            }
          } catch(e) {}

          var currentIndex = 0;
          var imgEl = document.getElementById('tv-fallback-img');
          var bgEl = document.getElementById('tv-fallback-bg');
          var timeEl = document.getElementById('tv-fallback-time');
          var dateEl = document.getElementById('tv-fallback-date');

          function updateClock() {
            var now = new Date();
            var hours = ('0' + now.getHours()).slice(-2);
            var mins = ('0' + now.getMinutes()).slice(-2);
            if (timeEl) timeEl.textContent = hours + ':' + mins;

            var days = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
            var months = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
            if (dateEl) {
              dateEl.textContent = days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()];
            }
          }

          function showPhoto(idx) {
            var url = photos[idx % photos.length];
            if (imgEl) imgEl.src = url;
            if (bgEl) bgEl.style.backgroundImage = 'url(' + url + ')';
          }

          updateClock();
          showPhoto(0);
          setInterval(updateClock, 1000);

          setInterval(function() {
            currentIndex = (currentIndex + 1) % photos.length;
            showPhoto(currentIndex);
          }, 10000);
        })();
      </script>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
